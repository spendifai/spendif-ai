name: Release — Build & Publish all platforms

# Triggered on version tags (v*.*.*) or manually.
# Builds native desktop apps for macOS, Windows, and Linux,
# creates a GitHub Release, and attaches all artifacts.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3). If empty, reads from VERSION file.'
        required: false
        default: ''

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Determine version once, share across jobs
  # ─────────────────────────────────────────────────────────────────────────
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            VER="$(cat VERSION | tr -d '[:space:]')"
          else
            VER="0.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

  # ─────────────────────────────────────────────────────────────────────────
  # macOS — PyInstaller → .app → DMG
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies (with desktop extras)
        run: uv sync --extra desktop

      # Only generate when the icon is missing. create_icon.py draws a
      # placeholder; running it unconditionally overwrote the committed brand
      # mark and shipped the old icon in every release built by CI.
      - name: Generate app icon (only if missing)
        run: |
          if [ -f packaging/macos/spendifai.icns ]; then
            echo "Using the committed icon — not regenerating"
          else
            uv run python packaging/macos/create_icon.py || echo "Icon generation failed — using default"
          fi

      - name: Stamp the build info
        # PyInstaller freezes whatever is on disk when it runs, so this has to
        # come first. Until now the stamp only happened inside build-dmg.sh,
        # which this job calls afterwards: every DMG shipped the version
        # committed in the repository, which is the previous release's. A 0.3.1
        # that believes it is 0.3.0 offers its own version as an upgrade to
        # every macOS user, forever.
        run: bash packaging/stamp-build-info.sh ${{ needs.prepare.outputs.version }}

      - name: Build .app via PyInstaller
        run: |
          uv run pyinstaller desktop.spec --noconfirm --clean
          ls -lh dist/

      - name: Verify .app bundle
        run: |
          test -d dist/SpendifAi.app
          echo "✅ SpendifAi.app created"
          # The bundle has to report the version being released. It reported
          # the previous one for every release until 0.3.1, and nothing failed.
          STAMPED=$(grep BUILD_VERSION dist/SpendifAi.app/Contents/Resources/core/_build_info.py | cut -d'"' -f2)
          if [ "$STAMPED" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "::error::the bundle reports $STAMPED, the release is ${{ needs.prepare.outputs.version }}"
            exit 1
          fi
          echo "✅ bundle reports $STAMPED"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DMG_PATH="dist/SpendifAi-${VERSION}-arm64.dmg"
          ICNS_PATH="packaging/macos/spendifai.icns"

          ICON_ARGS=""
          if [ -f "$ICNS_PATH" ]; then
            ICON_ARGS="--volicon $ICNS_PATH"
          fi

          create-dmg \
            --volname "Spendif.ai" \
            $ICON_ARGS \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SpendifAi.app" 175 190 \
            --hide-extension "SpendifAi.app" \
            --app-drop-link 425 190 \
            "$DMG_PATH" \
            "dist/SpendifAi.app" \
            || {
              # create-dmg exits 2 when it can't set icon (non-fatal)
              [ $? -eq 2 ] && echo "⚠ create-dmg icon warning (non-fatal)" || exit 1
            }

          ls -lh "$DMG_PATH"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-dmg
          path: dist/SpendifAi-*.dmg
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Windows: PyInstaller -> .exe folder -> MSIX (unsigned)
  #
  # The MSIX is produced unsigned in CI and signed locally afterwards, because
  # the Actalis code signing key lives on an HSM and every signature needs a
  # one-time password. No CI runner can hold that credential.
  #
  # Built with -Production so the manifest Publisher matches the certificate
  # subject exactly. Without it the package carries the self-signed dev DN and
  # signing fails with 0x8007000B, wasting an OTP.
  #
  # Signing (on macOS or Linux, no Windows machine needed):
  #   blueprint/sw_artifacts/tools/codesign/sign_windows.sh
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows MSIX
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies (with desktop extras)
        run: uv sync --extra desktop

      - name: Build MSIX (PyInstaller + makeappx)
        env:
          # X.500 subject of the code signing certificate. Personal data of the
          # certificate holder, so it lives in a repository secret and never in
          # the tree. Without it the build fails instead of silently producing a
          # package that cannot be signed.
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          .\packaging\windows\build-msix.ps1 -Version $version -Production

      - name: Verify MSIX
        run: |
          $msix = Get-ChildItem "build\SpendifAi-*.msix" | Select-Object -First 1
          if (-not $msix) {
            Write-Host "❌ MSIX not produced"
            exit 1
          }
          Write-Host "✅ $($msix.Name) ($([math]::Round($msix.Length / 1MB, 1)) MB)"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-msix
          path: build/SpendifAi-*.msix
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Linux — .deb + .rpm
  # ─────────────────────────────────────────────────────────────────────────
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # The .deb content is pure Python source — `uv sync` in postinst
      # compiles native deps on the target machine, so we ship the same
      # bytes for every Linux architecture. We still build two .deb files
      # with the right `Architecture:` declaration so apt installs cleanly
      # on both amd64 desktops and arm64 (Apple Silicon VMs, Raspberry Pi).
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install fakeroot
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot

      - name: Build .deb package
        run: bash packaging/linux/build-deb.sh --version ${{ needs.prepare.outputs.version }} --arch ${{ matrix.arch }}

      - name: Verify .deb
        run: ls -lh build/spendifai_*_${{ matrix.arch }}.deb

      - name: Smoke test — install in clean container
        # Only run the container smoke test on amd64. The arm64 .deb has
        # the same bytes — declaring it arm64 only sets the dpkg metadata.
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm \
            -v "$PWD/build:/packages:ro" \
            ubuntu:24.04 \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq /packages/spendifai_*_amd64.deb 2>&1 | tail -5
              dpkg -l spendifai | grep -q "^ii"
              echo "✅ .deb installed"
              test -f /opt/spendifai/app.py
              echo "✅ app.py found"
              apt-get remove -y spendifai
              echo "✅ removed cleanly"
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deb-package-${{ matrix.arch }}
          path: build/spendifai_*_${{ matrix.arch }}.deb
          retention-days: 30

  build-rpm:
    name: Build .rpm (Fedora)
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rpm-build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build .rpm package
        run: bash packaging/linux/build-rpm.sh --version ${{ needs.prepare.outputs.version }}

      - name: Verify .rpm
        run: ls -lh build/spendifai-*.rpm

      - name: Smoke test — install in clean container
        run: |
          docker run --rm \
            -v "$PWD/build:/packages:ro" \
            fedora:41 \
            bash -c '
              set -e
              dnf install -y -q /packages/spendifai-*.rpm 2>&1 | tail -5
              rpm -q spendifai
              echo "✅ .rpm installed"
              test -f /opt/spendifai/app.py
              echo "✅ app.py found"
              dnf remove -y spendifai
              echo "✅ removed cleanly"
            '

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rpm-package
          path: build/spendifai-*.rpm
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  build-arch:
    name: Build Arch package
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the package inside an Arch container
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Built from THIS checkout, not from a tarball fetched back from the
          # forge: the package is then the exact commit being released, there
          # is no checksum to bump by hand, and no race with GitHub generating
          # the tag archive. make-pkgbuild.sh derives the recipe from the
          # committed one so the two cannot drift apart.
          git archive --prefix="spendif-ai-${VERSION}/" -o /tmp/src.tar.gz HEAD
          bash packaging/linux/arch/make-pkgbuild.sh \
            --release "$VERSION" \
            --tarball /tmp/src.tar.gz \
            --out "$PWD/build/arch"

          docker run --rm -v "$PWD/build/arch:/pkg" -w /pkg archlinux:base-devel bash -c '
            set -e
            # makepkg refuses to run as root, deliberately.
            useradd -m builder
            chown -R builder /pkg
            # -d skips the dependency check: nothing is compiled here, the
            # dependencies matter at install time, and the smoke test below
            # proves them in a container that starts without any of them.
            su builder -c "makepkg -f -d"
          '
          ls -lh build/arch/*.pkg.tar.zst

      - name: Smoke test in a clean Arch container
        # The .deb job has the same step for the same reason. It is worth more
        # here: on 2026-09-22 the .deb shipped with `g++` missing from its
        # dependency list, and every machine that already had a compiler
        # installed it cleanly. A container that starts with nothing is the
        # only place where a missing dependency has to show itself.
        run: |
          docker run --rm -v "$PWD/build/arch:/packages:ro" archlinux:base bash -c '
            set -e
            pacman -Syu --noconfirm >/dev/null
            # -U pulls the declared dependencies from the repositories; one we
            # forgot to declare makes this fail instead of working by accident.
            pacman -U --noconfirm /packages/spendifai-*.pkg.tar.zst
            test -x /opt/spendifai/launch.sh
            test -f /opt/spendifai/app.py
            grep -qx arch /opt/spendifai/.install_method
            echo "package installed, files in place"
            pacman -Rns --noconfirm spendifai
            test ! -e /opt/spendifai
            echo "removed cleanly"
          '

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: arch-package
          path: build/arch/*.pkg.tar.zst
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Publish — Create GitHub Release + attach all artifacts
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Create GitHub Release
    needs: [prepare, build-macos, build-windows, build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: packages/

      - name: List all packages
        run: find packages/ -type f | sort

      - name: Compute SHA256 checksums
        run: |
          # I nomi devono essere NUDI, senza il percorso della cartella da cui
          # arrivano gli artefatti: chi scarica il file degli hash e un
          # installer li mette nella stessa cartella, e "sha256sum -c" cerca i
          # nomi cosi' come sono scritti. Con "./macos-dmg/SpendifAi.dmg" non
          # trova niente e la verifica diventa impossibile per chiunque.
          cd packages
          find . -type f \( -name "*.dmg" -o -name "*.msix" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" \) \
            -exec sh -c 'cd "$(dirname "$1")" && sha256sum "$(basename "$1")"' _ {} \; \
            | sort -k2 | tee ../SHA256SUMS.txt

      - name: Build release notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Extract changelog section
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            # Estrae la sezione DELLA VERSIONE che si sta rilasciando. La versione
            # precedente saltava la prima intestazione e stampava fino alla
            # seconda: con un "## [Unreleased]" vuoto in testa, che e' il caso
            # normale fra una release e l'altra, restituiva una stringa vuota e
            # la release usciva con le sole note di ripiego, senza dirlo.
            NOTES=$(awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          [ -z "$NOTES" ] && NOTES="Release v${VERSION}"

          # Write release notes to file
          cat > RELEASE_NOTES.md <<EOF
          ## Spendif.ai v${VERSION}

          ${NOTES}

          ### Downloads

          | Platform | File | Install |
          |----------|------|---------|
          | macOS (Apple Silicon) | SpendifAi-${VERSION}-arm64.dmg | Double-click, drag to Applications |
          | Windows | SpendifAi-${VERSION}.msix | Double-click to install (requires trusted signature) |
          | Ubuntu/Debian (x86_64) | spendifai_${VERSION}_amd64.deb | sudo apt install ./spendifai_${VERSION}_amd64.deb |
          | Ubuntu/Debian (ARM64) | spendifai_${VERSION}_arm64.deb | sudo apt install ./spendifai_${VERSION}_arm64.deb |
          | Fedora/RHEL | spendifai-${VERSION}-1.noarch.rpm | sudo dnf install ./spendifai-*.rpm |
          | Arch Linux | spendifai-${VERSION}-1-any.pkg.tar.zst | sudo pacman -Syu, then sudo pacman -U ./spendifai-*.pkg.tar.zst |

          ### SHA256 Checksums
          EOF
          cat SHA256SUMS.txt >> RELEASE_NOTES.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release is created as DRAFT so the owner can sign the unsigned
          # DMG / MSIX locally and replace them via `gh release upload --clobber`
          # before publishing. See docs/release.md (hybrid signing model).
          TAG="${{ needs.prepare.outputs.tag }}"
          FILES=$(find packages/ -type f \( -name "*.dmg" -o -name "*.msix" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" \))
          gh release create "$TAG" \
            --draft \
            --title "Spendif.ai $TAG" \
            --notes-file RELEASE_NOTES.md \
            $FILES SHA256SUMS.txt
