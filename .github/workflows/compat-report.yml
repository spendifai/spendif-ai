name: Compatibility report

# A test report filed through the issue form becomes a row of the
# compatibility table, without anyone copying a value by hand.
#
# The issue body is untrusted: the form is public. It never reaches a command
# line here. The script reads it from the event file, accepts only named
# fields, and reduces every value to characters Markdown cannot turn into
# markup. What it produces reaches the repository through a pull request, so a
# person still decides what is merged.
#
# All reports go to one branch and one open pull request, compat/reports.
# One pull request per report would conflict with each other on the same two
# files; one that grows is merged whenever convenient.

on:
  issues:
    types: [opened, edited]

concurrency:
  group: compat-report
  cancel-in-progress: false

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'test-report')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: compat/reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Start from the open branch, or from develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/develop
          else
            git checkout -B "$BRANCH" origin/develop
          fi

      - name: Read the report
        id: read
        run: |
          set +e
          python3 scripts/compat_report.py \
            --event "$GITHUB_EVENT_PATH" \
            --store docs/compatibility/reports.jsonl \
            --docs docs \
            --summary /tmp/summary.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Say why it could not be read
        if: steps.read.outputs.code != '0'
        run: |
          set -euo pipefail
          {
            echo "This report could not be added to the compatibility table:"
            echo
            echo '```'
            cat /tmp/summary.txt
            echo '```'
            echo
            echo "The XML document from the Diagnostics page has to be in the **Report** field, unchanged."
            echo "Editing the issue runs the check again."
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
          exit 1

      - name: Commit, push, and open or update the pull request
        if: steps.read.outputs.code == '0'
        run: |
          set -euo pipefail
          git add docs/compatibility/reports.jsonl docs/compatibility.md docs/compatibility.it.md
          if git diff --cached --quiet; then
            echo "Nothing changed: the report was already in the table."
            exit 0
          fi
          git commit -m "docs(compat): test report #${ISSUE}"
          git push origin "$BRANCH"

          # Opening a pull request with this token needs the repository setting
          # "Allow GitHub Actions to create and approve pull requests". Without
          # it the branch is still pushed, and the comment carries the link
          # that opens the pull request in one click.
          PR=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --head "$BRANCH" --base develop \
              --title "Compatibility table: new test reports" \
              --body "Rows added from test reports filed through the issue form. Generated by the compatibility report workflow; each commit names the issue it comes from." \
              || echo "::warning::could not open the pull request; the branch is pushed"
            PR=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          fi
          if [ -n "$PR" ]; then
            WHERE="once #${PR} is merged"
          else
            WHERE="once the branch is merged: https://github.com/${GITHUB_REPOSITORY}/compare/develop...${BRANCH}?expand=1"
          fi

          {
            echo "Thanks. This configuration goes into the compatibility table:"
            echo
            echo '```'
            cat /tmp/summary.txt
            echo '```'
            echo
            echo "It appears in docs/compatibility.md ${WHERE}."
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
          gh issue close "$ISSUE" --reason completed
