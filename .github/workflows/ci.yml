name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify prompt integrity (S-01)
        run: uv run python tools/compute_prompt_hashes.py --verify

      - name: Verify benchmark CSV append-only (T-09d)
        if: github.event_name == 'pull_request'
        run: uv run python tools/verify_bench_csv.py --base origin/${{ github.base_ref }}

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
        env:
          # Prevent any accidental network calls to real LLM backends
          OLLAMA_BASE_URL: "http://localhost:99999"
          OPENAI_API_KEY: "test-key-ci"
          ANTHROPIC_API_KEY: "test-key-ci"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create minimal .env for CI
        run: cp .env.example .env

      - name: Build Docker image
        run: docker compose -f docker/docker-compose.yml build --no-cache

      - name: Start container
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for healthcheck to pass (max 60s)
        run: |
          echo "Waiting for Streamlit to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              echo "✅ App is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ App did not become healthy in time"
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Smoke test — verify health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/_stcore/health)
          echo "Health endpoint status: $STATUS"
          [ "$STATUS" = "200" ] || (docker compose -f docker/docker-compose.yml logs && exit 1)

      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  coupling-check:
    name: Coupling check (UI ↔ Service layer)
    runs-on: ubuntu-latest
    # Serve solo write su pull_request per poter postare il commento
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run coupling check — strict mode (ratchet baseline)
        # Exit 1 if a file not in the baseline has violations,
        # or if a file in the baseline exceeds its max_violations.
        # The JSON is saved for the following steps.
        # set -o pipefail is REQUIRED: without it the pipe returns tee's exit
        # code (always 0), so a failing check would never fail the job.
        run: |
          set -o pipefail
          uv run python tools/coupling_check.py --strict --json | tee coupling_report.json
        # The job fails if the command exits with code 1.
        # continue-on-error: false  ← default, explicit for clarity

      - name: Upload coupling report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coupling-report
          path: coupling_report.json
          retention-days: 30

      - name: Post PR comment with coupling summary
        # Post a summary comment on the PR. Runs even when the previous
        # check failed (if: always()) so the contributor sees what broke
        # without having to dig into the workflow logs.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('coupling_report.json', 'utf8'));
            } catch (e) {
              console.log('coupling_report.json not found, skipping comment');
              return;
            }

            const strict    = report.strict || {};
            const passed    = strict.strict_pass;
            const icon      = passed ? '✅' : '❌';
            const headline  = passed
              ? '**Coupling check PASSED** — no coupling regression.'
              : '**Coupling check FAILED** — new coupling violations detected.';

            // Tabella per file
            const rows = report.files
              .map(f => {
                const status = f.violations === 0
                  ? '✅'
                  : (strict.failures && strict.failures.some(s => s.includes(f.path)) ? '❌' : '⚠️');
                return `| ${status} | \`${f.path}\` | ${f.violations} | ${f.compliant} | ${(f.score * 100).toFixed(0)}% |`;
              })
              .join('\n');

            // Details on the failing files
            let violationDetail = '';
            if (!passed && strict.failures && strict.failures.length > 0) {
              violationDetail = '\n### Violations to fix\n```\n'
                + strict.failures.join('\n')
                + '\n```\n';
            }

            // Baseline improvement notices — opportunities to tighten the baseline
            let warningDetail = '';
            if (strict.warnings && strict.warnings.length > 0) {
              warningDetail = '\n### ⚠️ Baseline improved — update coupling_baseline.json\n'
                + strict.warnings.map(w => `- ${w.trim()}`).join('\n') + '\n';
            }

            const body = [
              `## ${icon} Coupling Report — UI ↔ Service layer`,
              '',
              headline,
              '',
              `**Total violations:** ${report.total_violations} | **Clean files:** ${report.files.filter(f => f.violations === 0).length}/${report.files.length} | **Coupling score:** ${(report.coupling_score * 100).toFixed(0)}%`,
              '',
              '| | File | Violations | Compliant | Score |',
              '|---|---|---|---|---|',
              rows,
              violationDetail,
              warningDetail,
              '',
              '> **Rule:** every new file must have 0 violations.',
              '> Known exceptions are listed in [`tools/coupling_baseline.json`](tools/coupling_baseline.json).',
            ].join('\n');

            // Cerca un commento precedente di questo bot e aggiornalo
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Coupling Report — UI ↔ Service layer')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  security:
    name: Security scanning (SAST + deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # ── Bandit (Python SAST) ──────────────────────────────
      - name: Install Bandit
        run: uv pip install bandit[toml]

      - name: Run Bandit — code injection & security checks
        run: |
          SCAN_DIRS="core/ services/ db/ api/ chat_bot/ support/ desktop/"
          # Full report (all severities) — saved as artifact, never fails the build
          uv run bandit -r $SCAN_DIRS \
            -c pyproject.toml \
            -f json -o bandit-report.json \
            || true
          # Hard gate: fail only on HIGH severity + HIGH confidence issues
          # --exit-zero prevents bandit from failing on LOW/MEDIUM findings
          # We then check the JSON report for actual HIGH issues
          HIGH_COUNT=$(uv run bandit -r $SCAN_DIRS \
            -c pyproject.toml \
            -ll -ii \
            -f json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          high = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH' and r.get('issue_confidence') == 'HIGH']
          print(len(high))
          " 2>/dev/null || echo "0")
          echo "HIGH severity + HIGH confidence issues: $HIGH_COUNT"
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ Bandit found $HIGH_COUNT HIGH/HIGH issue(s):"
            uv run bandit -r $SCAN_DIRS -c pyproject.toml -ll -ii || true
            exit 1
          fi
          echo "✅ No HIGH severity issues found"
          # Note: quarantine/ excluded — archived/dead code, not shipped

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      # ── Semgrep (OWASP / broader SAST) ───────────────────
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep — OWASP top-10 rules (audit mode)
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --exclude="tests/*" --exclude="benchmark/*" \
            --exclude="quarantine/*" --exclude="tools/*" \
            --json -o semgrep-report.json \
            || true
          # Audit mode: report findings but don't block the build.
          # Findings are uploaded as artifact for review.
          TOTAL=$(python3 -c "import json; print(len(json.load(open('semgrep-report.json')).get('results',[])))" 2>/dev/null || echo "?")
          echo "Semgrep findings: $TOTAL (audit mode — not blocking)"

      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

      # ── pip-audit (known CVEs in dependencies) ───────────
      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Run pip-audit — dependency vulnerabilities
        run: |
          uv run pip-audit \
            --requirement <(uv pip freeze) \
            --format json --output pip-audit-report.json \
            || true
          # Strict gate: fail on known CVEs with available fixes.
          # --ignore-vuln for CVEs without upstream fix (no action possible).
          #   CVE-2025-69872 — no fix release available
          #   PYSEC-2025-183 — pyjwt 2.12.1 transitive dep of semgrep,
          #                    no fix release available (semgrep pin
          #                    forces pyjwt~=2.12.0). Re-evaluate on
          #                    each semgrep upgrade.
          uv run pip-audit \
            --requirement <(uv pip freeze) \
            --strict \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln PYSEC-2025-183

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      # ── ShellCheck (bash injection / script quality) ─────
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on installer scripts
        run: |
          shellcheck --severity=warning \
            installer/install.sh \
            installer/uninstall.sh \
            benchmark/run_benchmark_full.sh \
            docker/benchmark_entrypoint.sh \
            packaging/macos/install.sh \
            packaging/macos/uninstall.sh \
            packaging/linux/install-debian.sh \
            packaging/linux/install-redhat.sh \
            packaging/linux/uninstall.sh \
            packaging/linux/build-deb.sh \
            packaging/linux/build-rpm.sh

      # ── Trivy (Docker image vulnerabilities) ────────────
      - name: Build Docker image for scanning
        run: docker build -f docker/Dockerfile -t spendify:scan .

      - name: Run Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'spendify:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  installer-validate:
    name: Installer validation (syntax + compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate install.sh syntax
        run: bash -n installer/install.sh && echo "✅ install.sh syntax OK"

      - name: Validate uninstall.sh syntax
        run: bash -n installer/uninstall.sh && echo "✅ uninstall.sh syntax OK"

      - name: Validate docker-compose.release.yml
        run: |
          # docker compose config validates YAML syntax, anchors and service references
          docker compose -f docker/docker-compose.release.yml config --quiet
          echo "✅ docker-compose.release.yml is valid"

      - name: Validate install.ps1 syntax (PowerShell)
        run: |
          # pwsh is available on ubuntu-latest GitHub runners
          pwsh -NoProfile -Command "
            \$err = \$null
            \$null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path installer/install.ps1),
              [ref]\$null,
              [ref]\$err
            )
            if (\$err.Count -gt 0) {
              \$err | ForEach-Object { Write-Error \$_.Message }
              exit 1
            }
            Write-Host '✅ install.ps1 syntax OK'
          "

      - name: Validate uninstall.ps1 syntax (PowerShell)
        run: |
          pwsh -NoProfile -Command "
            \$err = \$null
            \$null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path installer/uninstall.ps1),
              [ref]\$null,
              [ref]\$err
            )
            if (\$err.Count -gt 0) {
              \$err | ForEach-Object { Write-Error \$_.Message }
              exit 1
            }
            Write-Host '✅ uninstall.ps1 syntax OK'
          "

      - name: Validate native installer .ps1 syntax (PowerShell)
        run: |
          for f in packaging/windows/install.ps1 packaging/windows/uninstall.ps1; do
            pwsh -NoProfile -Command "
              \$err = \$null
              \$null = [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path '$f'),
                [ref]\$null,
                [ref]\$err
              )
              if (\$err.Count -gt 0) {
                \$err | ForEach-Object { Write-Error \$_.Message }
                exit 1
              }
              Write-Host '✅ $f syntax OK'
            "
          done

      - name: Validate Linux package build scripts (syntax)
        run: |
          for f in packaging/linux/build-deb.sh packaging/linux/build-rpm.sh; do
            bash -n "$f" && echo "✅ $f syntax OK"
          done
